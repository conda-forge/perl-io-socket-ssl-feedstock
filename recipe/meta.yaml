{% set name = "perl-io-socket-ssl" %}
{% set version = "2.099" %}
{% set sha256 = "a0be800ff4852b1567ee5500e772417ad7a360abff80c01b5b875c15d44be832" %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  url: https://cpan.metacpan.org/authors/id/S/SU/SULLR/IO-Socket-SSL-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: generic
  number: 0
  script:
    - perl Makefile.PL INSTALLDIRS=vendor NO_PERLLOCAL=1 NO_PACKLIST=1
    - make
    - make test
    - make install VERBINST=1

requirements:
  build:
    - make
  host:
    - perl
    - perl-extutils-makemaker
    - perl-net-ssleay
  run:
    - perl
    - perl-net-ssleay

test:
  imports:
    - IO::Socket::SSL

about:
  home: https://metacpan.org/dist/IO-Socket-SSL
  license: GPL-1.0-or-later OR Artistic-1.0-Perl
  license_family: OTHER
  summary: 'Nearly transparent SSL encapsulation for IO::Socket::INET.'
  license_file:
    - {{ environ["PREFIX"] }}/lib/perl5/core_perl/pod/perlartistic.pod
    - {{ environ["PREFIX"] }}/lib/perl5/core_perl/pod/perlgpl.pod

extra:
  recipe-maintainers:
    - dslarm
    - cbrueffer
